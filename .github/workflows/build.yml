name: Desktop-Pakete

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: Windows-x64
          - runner: macos-15
            artifact: macOS-Sequoia-arm64
          - runner: macos-15-intel
            artifact: macOS-Sequoia-x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt
      - name: Automatisierte Tests
        run: python scripts/run_tests.py
      - name: Eigenständig startbares Paket erstellen
        run: python scripts/build.py
      - name: Gebautes Programm mit Solver und Oberfläche prüfen
        run: python scripts/check_package.py
      - name: Pakete zur Prüfung bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Dienstplan-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/build-report.json
          if-no-files-found: error
